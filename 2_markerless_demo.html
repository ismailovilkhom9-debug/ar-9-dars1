<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markerless AR demo (A-Frame + WebXR hit-test)</title>
  <script src="aframe-1.5.0.min.js"></script>
</head>
<body>
  <!--
    Markerless AR: marker yo'q. Brauzer (ARCore orqali) xonani SLAM/VIO bilan kuzatadi,
    pol va stol kabi tekisliklarni topadi (plane detection). hit-test shu tekislikka
    nur yuboradi va natijada "ko'rsatkich halqa" (reticle) tekislik ustida turadi.
    Ekranga bosganda shu joyga virtual obyekt qo'yiladi.
    Talab: Android + Chrome (HTTPS orqali ochiladi).
  -->
  <a-scene webxr="requiredFeatures: hit-test; optionalFeatures: local-floor, dom-overlay; overlayElement: #overlay;"
           renderer="alpha: true" vr-mode-ui="enabled: false" ar-mode-ui="enabled: true">

    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>

    <!-- Reticle: tizim aniqlagan tekislikni ko'rsatadi -->
    <a-ring id="reticle" radius-inner="0.08" radius-outer="0.1" rotation="-90 0 0"
            color="#2ecc71" visible="false" hit-test-reticle></a-ring>

    <!-- Qo'yiladigan obyektlar shu yerga qo'shiladi -->
    <a-entity id="placed"></a-entity>

    <a-entity camera look-controls></a-entity>
  </a-scene>

  <div id="overlay" style="position:fixed; left:12px; right:12px; bottom:12px; padding:10px 14px;
       border-radius:8px; background:#1b2430; color:#fff; font:16px/1.4 system-ui,sans-serif; text-align:center;">
    <span id="msg">AR tugmasini bosing, so'ng telefonni sekin harakatlantiring (initialization)</span>
  </div>

  <script>
    // Qurilma AR'ni qo'llab-quvvatlashini tekshirish
    window.addEventListener('load', () => {
      const msg = document.getElementById('msg');
      if (!window.AFRAME) { msg.textContent = 'Xato: aframe-1.5.0.min.js yuklanmadi'; return; }
      if (!navigator.xr) { msg.textContent = 'Bu brauzer WebXR\'ni qo\'llamaydi. Android\'da Chrome ishlating.'; return; }
      navigator.xr.isSessionSupported('immersive-ar').then(ok => {
        msg.textContent = ok ? 'AR tayyor: pastdagi/o\'ngdagi AR tugmasini bosing, so\'ng telefonni sekin harakatlantiring'
                             : 'Bu qurilma AR (ARCore) ni qo\'llamaydi yoki Google Play Services for AR o\'rnatilmagan';
      }).catch(e => { msg.textContent = 'AR tekshiruvi xatosi: ' + e.name; });
    });

    AFRAME.registerComponent('hit-test-reticle', {
      init() {
        const scene = this.el.sceneEl;
        this.source = null;
        this.found = false;
        this.msg = document.getElementById('msg');
        this.lastPose = null;

        scene.addEventListener('enter-vr', () => {
          const session = scene.renderer.xr.getSession();
          if (!session) return;
          // "viewer" fazosidan tekislikka nur yuboriladi
          session.requestReferenceSpace('viewer').then(space => {
            session.requestHitTestSource({ space }).then(src => { this.source = src; });
          });
          // Ekranga bosish: shu joyga obyekt qo'yish
          session.addEventListener('select', () => this.place());
          session.addEventListener('end', () => { this.source = null; });
        });
      },

      tick() {
        const scene = this.el.sceneEl;
        const frame = scene.frame;
        if (!frame || !this.source) return;
        const refSpace = scene.renderer.xr.getReferenceSpace();
        const hits = frame.getHitTestResults(this.source);
        if (hits.length > 0) {
          const pose = hits[0].getPose(refSpace);
          const p = pose.transform.position, o = pose.transform.orientation;
          this.el.object3D.position.set(p.x, p.y, p.z);
          this.el.object3D.quaternion.set(o.x, o.y, o.z, o.w);
          this.el.object3D.visible = true;
          this.lastPose = { p: { x: p.x, y: p.y, z: p.z } };
          if (!this.found) { this.found = true; this.msg.textContent = 'Tekislik topildi: ekranga bosing'; }
        } else {
          this.el.object3D.visible = false;
          this.lastPose = null;
          if (this.found) { this.found = false; this.msg.textContent = 'Tekislik yo\'qoldi: atrofga sekin qarang'; }
        }
      },

      place() {
        if (!this.lastPose) return;
        const box = document.createElement('a-box');
        const { x, y, z } = this.lastPose.p;
        box.setAttribute('position', `${x} ${y + 0.1} ${z}`);
        box.setAttribute('width', 0.2);
        box.setAttribute('height', 0.2);
        box.setAttribute('depth', 0.2);
        box.setAttribute('color', '#2a7de1');
        document.getElementById('placed').appendChild(box);
      }
    });
  </script>
</body>
</html>
