<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR sessiya testi (A-Frame'siz)</title>
  <style>
    body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
    button { font: 600 18px system-ui; padding: 14px 24px; border: 0; border-radius: 10px; background: #2a7de1; color: #fff; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>AR sessiya testi</h3>
  <p>Bu sahifa A-Frame'siz, to'g'ridan-to'g'ri brauzerning AR imkoniyatini tekshiradi.</p>
  <p><button id="t1">1) Oddiy AR sessiya</button></p>
  <p><button id="t2">2) hit-test ixtiyoriy</button></p>
  <p><button id="t3">3) hit-test majburiy</button></p>
  <pre id="o"></pre>
  <script>
    const o = document.getElementById('o');
    o.textContent = 'navigator.xr: ' + (navigator.xr ? 'bor' : 'YO\'Q') + '\n';
    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-ar')
        .then(ok => { o.textContent += 'immersive-ar qo\'llanadi: ' + ok + '\n'; })
        .catch(e => { o.textContent += 'isSessionSupported xatosi: ' + e.name + '\n'; });
    }
    async function run(name, init) {
      o.textContent += '\n[' + name + '] so\'ralmoqda...\n';
      try {
        const s = await navigator.xr.requestSession('immersive-ar', init);
        o.textContent += '[' + name + '] OK. yoqilgan imkoniyatlar: ' + JSON.stringify(s.enabledFeatures || 'noma\'lum') + '\n';
        setTimeout(() => s.end(), 3000);
      } catch (e) {
        o.textContent += '[' + name + '] XATO: ' + e.name + ' - ' + e.message + '\n';
      }
    }
    document.getElementById('t1').onclick = () => run('1 oddiy', {});
    document.getElementById('t2').onclick = () => run('2 ixtiyoriy', { optionalFeatures: ['hit-test'] });
    document.getElementById('t3').onclick = () => run('3 majburiy', { requiredFeatures: ['hit-test'] });
  </script>
</body>
</html>
