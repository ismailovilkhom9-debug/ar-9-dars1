<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markerless AR (ARCore Scene Viewer)</title>
  <script type="module" src="model-viewer.min.js"></script>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
    header { padding: 12px 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 4px 0; color: #444; }
    model-viewer { width: 100%; height: 60vh; background: #eef1f5; }
    #arBtn {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      font: 600 18px system-ui, sans-serif; padding: 14px 26px; border: 0;
      border-radius: 10px; background: #2a7de1; color: #fff;
    }
    #msg { padding: 12px 16px; }
    #ver { font: 12px monospace; color: #777; padding: 0 16px 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Markerless AR: tekislikni aniqlash</h1>
    <p>Tugmani bosing, telefonni sekin harakatlantirib polni toping va o'rdakni shu joyga qo'ying.</p>
  </header>

  <model-viewer src="Duck.glb" alt="3D o'rdak modeli"
                ar ar-modes="scene-viewer webxr quick-look" ar-placement="floor" ar-scale="auto"
                camera-controls touch-action="pan-y" shadow-intensity="1" auto-rotate>
    <button slot="ar-button" id="arBtn">AR rejimida ko'rish</button>
  </model-viewer>

  <div id="msg">Model yuklanmoqda...</div>
  <div id="ver">versiya: v1</div>

  <script>
    const mv = document.querySelector('model-viewer');
    const msg = document.getElementById('msg');
    mv.addEventListener('load', () => {
      msg.textContent = mv.canActivateAR
        ? 'Tayyor: "AR rejimida ko\'rish" tugmasini bosing.'
        : 'Model yuklandi, lekin bu qurilma yoki brauzer AR\'ni ocholmaydi (canActivateAR = false).';
    });
    mv.addEventListener('error', () => { msg.textContent = 'Model yuklanmadi (Duck.glb topilmadi).'; });
    mv.addEventListener('ar-status', e => {
      if (e.detail.status === 'failed') msg.textContent = 'AR ochilmadi. Google Play Services for AR ni yangilang.';
    });
  </script>
</body>
</html>
