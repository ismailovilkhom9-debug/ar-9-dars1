<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marker-based AR demo (A-Frame + AR.js)</title>
  <!-- A-Frame va AR.js (marker-based tracking) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    #status {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10;
      padding: 10px 14px; border-radius: 8px; font: 16px/1.4 system-ui, sans-serif;
      background: #1b2430; color: #fff; text-align: center;
    }
    #status.found { background: #14663a; }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <div id="status">Kamerani Hiro markeriga qarating</div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; detectionMode: mono_and_matrix; debugUIEnabled: false;">

    <!-- Marker: AR.js ichiga o'rnatilgan "hiro" markeri -->
    <a-marker preset="hiro" id="marker">
      <!-- Virtual obyektlar marker koordinata tizimiga nisbatan joylashadi -->
      <a-box position="0 0.5 0" scale="1 1 1" color="#2a7de1">
        <a-animation attribute="rotation" to="0 360 0" dur="6000" easing="linear" repeat="indefinite"></a-animation>
      </a-box>
      <a-cylinder position="1.4 0.4 0" radius="0.3" height="0.8" color="#e1a32a"></a-cylinder>
      <a-sphere position="-1.4 0.4 0" radius="0.4" color="#d9423a"></a-sphere>
      <a-text value="Marker topildi!" align="center" color="#111" position="0 1.6 0" scale="2 2 2"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Tracking holatini kuzatish: marker ko'rinsa "found", yo'qolsa "lost"
    const marker = document.getElementById('marker');
    const status = document.getElementById('status');
    marker.addEventListener('markerFound', () => {
      status.textContent = 'Marker topildi: tracking ishlayapti';
      status.classList.add('found');
    });
    marker.addEventListener('markerLost', () => {
      status.textContent = 'Marker yo\'qoldi: tracking to\'xtadi';
      status.classList.remove('found');
    });
  </script>
</body>
</html>
