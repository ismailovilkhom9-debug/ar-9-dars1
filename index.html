<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marker-based AR demo (A-Frame + AR.js)</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #status {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 9999;
      padding: 10px 14px; border-radius: 8px; font: 16px/1.4 system-ui, sans-serif;
      background: #1b2430; color: #fff; text-align: center;
    }
    #status.found { background: #14663a; }
    #status.error { background: #8a1c1c; }
    #start {
      position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px;
      background: #0f1720; color: #fff; font: 18px/1.4 system-ui, sans-serif; text-align: center;
    }
    #start button {
      font: 600 18px system-ui, sans-serif; padding: 14px 28px; border: 0;
      border-radius: 10px; background: #2a7de1; color: #fff;
    }
  </style>
</head>
<body>
  <div id="start">
    <div>Marker-based AR demo</div>
    <div style="font-size:15px; opacity:.8">Tugmani bosing va kameraga ruxsat bering</div>
    <button id="startBtn">Kamerani yoqish</button>
  </div>

  <div id="status">Yuklanmoqda...</div>

  <script>
    const status = document.getElementById('status');
    function setStatus(text, cls) {
      status.textContent = text;
      status.className = cls || '';
    }

    // 1) Kutubxonalar yuklanganini tekshirish
    window.addEventListener('load', () => {
      if (!window.AFRAME) { setStatus('Xato: A-Frame yuklanmadi (internet yoki jsdelivr muammosi)', 'error'); return; }
      if (!AFRAME.systems || !AFRAME.systems.arjs) { setStatus('Xato: AR.js yuklanmadi (internet yoki jsdelivr muammosi)', 'error'); return; }
      setStatus('Tayyor: "Kamerani yoqish" tugmasini bosing');
    });

    // 2) Tugma bosilganda kameraga ruxsat so'raymiz, keyin AR sahnasini qo'shamiz
    document.getElementById('startBtn').addEventListener('click', async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Xato: brauzer kamerani qo\'llamaydi yoki sahifa HTTPS emas', 'error');
        document.getElementById('start').style.display = 'none';
        return;
      }
      try {
        const test = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        test.getTracks().forEach(t => t.stop());
      } catch (e) {
        document.getElementById('start').style.display = 'none';
        setStatus('Kamera xatosi: ' + e.name + '. Chrome sozlamalaridan kameraga ruxsat bering.', 'error');
        return;
      }
      document.getElementById('start').style.display = 'none';
      setStatus('Kamerani Hiro markeriga qarating');
      buildScene();
    });

    function buildScene() {
      const html = `
        <a-scene vr-mode-ui="enabled: false"
                 renderer="logarithmicDepthBuffer: true; alpha: true"
                 embedded
                 arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
          <a-marker preset="hiro" id="marker">
            <a-box position="0 0.5 0" color="#2a7de1"
                   animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true"></a-box>
            <a-cylinder position="1.4 0.4 0" radius="0.3" height="0.8" color="#e1a32a"></a-cylinder>
            <a-sphere position="-1.4 0.4 0" radius="0.4" color="#d9423a"></a-sphere>
          </a-marker>
          <a-entity camera></a-entity>
        </a-scene>`;
      document.body.insertAdjacentHTML('afterbegin', html);

      const marker = document.getElementById('marker');
      marker.addEventListener('markerFound', () => setStatus('Marker topildi: tracking ishlayapti', 'found'));
      marker.addEventListener('markerLost', () => setStatus('Marker yo\'qoldi: tracking to\'xtadi'));
    }
  </script>
</body>
</html>
