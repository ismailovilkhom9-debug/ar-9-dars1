<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marker-based AR demo (A-Frame + AR.js)</title>
  <script src="aframe.min.js" onerror="window.libErr=(window.libErr||'')+' aframe.min.js'"></script>
  <script src="aframe-ar.js" onerror="window.libErr=(window.libErr||'')+' aframe-ar.js'"></script>
  <style>
    #info {
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999; padding: 6px 10px;
      font: 13px/1.4 monospace; background: rgba(0,0,0,.75); color: #9f9; white-space: pre-wrap;
    }
    #status {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 9999;
      padding: 10px 14px; border-radius: 8px; font: 16px/1.4 system-ui, sans-serif;
      background: #1b2430; color: #fff; text-align: center;
    }
    #status.found { background: #14663a; }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <div id="info">diagnostika...</div>
  <div id="status">Kamerani Hiro markeriga qarating</div>

  <a-scene vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;" embedded
           arjs="sourceType: webcam; debugUIEnabled: false; cameraParametersUrl: camera_para.dat; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">
    <a-marker type="pattern" url="patt.hiro" id="marker">
      <a-box position="0 0.5 0" color="#2a7de1"
             animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true"></a-box>
      <a-cylinder position="1.4 0.4 0" radius="0.3" height="0.8" color="#e1a32a"></a-cylinder>
      <a-sphere position="-1.4 0.4 0" radius="0.4" color="#d9423a"></a-sphere>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const info = document.getElementById('info');
    const status = document.getElementById('status');
    const errors = [];
    let camMsg = 'kutilmoqda';

    window.addEventListener('error', e => errors.push('JS: ' + e.message));
    window.addEventListener('camera-init', () => { camMsg = 'camera-init OK'; });
    window.addEventListener('camera-error', e => {
      camMsg = 'camera-error: ' + ((e.detail && e.detail.error && (e.detail.error.name || e.detail.error)) || '?');
    });

    const marker = document.getElementById('marker');
    marker.addEventListener('markerFound', () => { status.textContent = 'Marker topildi: tracking ishlayapti'; status.className = 'found'; });
    marker.addEventListener('markerLost', () => { status.textContent = 'Marker yo\'qoldi: tracking to\'xtadi'; status.className = ''; });

    setInterval(() => {
      const v = document.querySelector('video');
      const c = document.querySelector('canvas.a-canvas');
      const lines = [
        'A-Frame: ' + (window.AFRAME ? 'ok' : 'YO\'Q') + ' | AR.js: ' + (window.AFRAME && AFRAME.systems && AFRAME.systems.arjs ? 'ok' : 'YO\'Q'),
        'kamera: ' + camMsg,
        'video: ' + (v ? (v.videoWidth + 'x' + v.videoHeight + ' readyState=' + v.readyState + ' paused=' + v.paused + ' z=' + v.style.zIndex) : 'topilmadi'),
        'canvas: ' + (c ? (c.width + 'x' + c.height) : 'topilmadi')
      ];
      if (window.libErr) lines.push('Yuklanmagan fayl:' + window.libErr);
      if (errors.length) lines.push(errors.slice(-2).join('\n'));
      info.textContent = lines.join('\n');
    }, 1000);
  </script>
</body>
</html>
